name: Build Android private test APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-user-home
      ANDROID_TEST_KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install persistent private-test signing key
        shell: bash
        run: |
          if [[ -z "$ANDROID_TEST_KEYSTORE_B64" ]]; then
            echo "Missing repository Actions secret ANDROID_TEST_KEYSTORE_B64. Add the existing employee test keystore as a base64-encoded secret so APK updates keep the same signature."
            exit 1
          fi
          mkdir -p "$ANDROID_USER_HOME"
          printf '%s' "$ANDROID_TEST_KEYSTORE_B64" | base64 --decode > "$ANDROID_USER_HOME/employee-debug.keystore"
          chmod 600 "$ANDROID_USER_HOME/employee-debug.keystore"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The repository includes a vendored StrongSwan wrapper JAR whose hash
          # is not in Gradle's public allowlist. The build uses the root wrapper.
          validate-wrappers: false

      - name: Build F-Droid debug APK splits (32-bit, 64-bit, universal)
        run: ./gradlew :mobile:assembleFdroidDebug -PemployeeAbiSplits

      - uses: actions/upload-artifact@v4
        with:
          name: windscribe-android-private-test
          path: mobile/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^extra\["appVersionName"\] = "([^"]+)".*/\1/p' build.gradle.kts)"
          if [[ -z "$version" ]]; then
            echo "Could not read appVersionName from build.gradle.kts." >&2
            exit 1
          fi
          short="${GITHUB_SHA:0:7}"
          tag="v${version}-private-${short}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Private test ${version} (${short})" \
              --notes "Private test build of commit ${GITHUB_SHA}. F-Droid debug APKs signed with the persistent private test keystore, so they install as updates over earlier private test builds." \
              || true
          fi
          gh release upload "$tag" mobile/build/outputs/apk/fdroid/debug/*.apk --repo "$GITHUB_REPOSITORY" --clobber
